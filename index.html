<!-- =========================
     SETTINGS MODAL
========================== -->

<div
    class="wisp-settings-modal hidden"
    id="wisp-settings-modal"
>

    <div class="settings-card">


        <!-- Main Header -->

                aria-label="Close settings"

            </button>

        </div>


        <!-- Scrollable Content -->

        <div class="settings-scroll">


            <!-- =========================
                 TWO COLUMN SETTINGS GRID
            ========================== -->

            <div class="settings-grid">


                <!-- =========================
                     PROXY SETTINGS
                ========================== -->

                <section class="settings-panel">

                    <div class="settings-header">

                        <h2>
                            <i class="fa-solid fa-server"></i>
                            Proxy Settings
                        </h2>

                    </div>


                    <div class="settings-content">


                        <div class="section-title">

                            <i class="fa-solid fa-cloud"></i>

                            Select Server

                        </div>


                        <div
                            class="server-list"
                            id="server-list"
                        ></div>


                        <div class="section-title">

                            <i class="fa-solid fa-plus-circle"></i>

                            Custom Server

                        </div>


                        <div class="custom-input-group">

                                placeholder="wss://your-wisp-server.com/wisp/"
                            >

                                id="save-custom-wisp"
                                aria-label="Add custom server"
                            >

                            </button>

                        </div>


                    </div>


                    <div class="settings-footer">

                        <i class="fa-solid fa-bolt"></i>

                        Lower ping = faster browsing

                    </div>


                </section>



                <!-- =========================
                     USER SETTINGS
                ========================== -->

                <section class="settings-panel">

                    <div class="settings-header">

                        <h2>

                            <i class="fa-solid fa-user"></i>

                            User Settings

                        </h2>

                    </div>


                    <div class="settings-content">


                        <!-- Tab Title -->

                        <div class="section-title">

                            <i class="fa-solid fa-eye-slash"></i>

                            Tab Title

                        </div>


                        <div class="custom-input-group">

                            <input
                                type="text"
                                id="titleInput"
                                placeholder="Google Classroom"
                            >

                        </div>


                        <div class="settings-spacing"></div>


                        <!-- Favicon -->

<!-- =========================
     USER SETTINGS
========================== -->

<script>

    function applyChanges() {

        const title =
            document.getElementById("titleInput").value;

        const favicon =
            document.getElementById("faviconInput").value;


        /*
         * Only change the title if
         * the user actually entered one.
         */

        if (title.trim()) {

            document.title = title;

            localStorage.setItem(
                "customTabTitle",
                title
            );

        }


        /*
         * Only change the favicon if
         * the user entered one.
         */

        if (favicon.trim()) {

            let link =
                document.querySelector(
                    "link[rel~='icon']"
                );


            if (!link) {

                link =
                    document.createElement("link");

                link.rel = "icon";

                document.head.appendChild(link);

            }


            link.href = favicon;


            localStorage.setItem(
                "customFavicon",
                favicon
            );

        }

    }


    /*
     * Load previously saved settings.
     */

    window.addEventListener(
        "DOMContentLoaded",
        () => {

            const savedTitle =
                localStorage.getItem(
                    "customTabTitle"
                );


            const savedFavicon =
                localStorage.getItem(
                    "customFavicon"
                );


            if (savedTitle) {

                document.title =
                    savedTitle;


                const titleInput =
                    document.getElementById(
                        "titleInput"
                    );


                if (titleInput) {

                    titleInput.value =
                        savedTitle;

                }

            }


            if (savedFavicon) {

                let link =
                    document.querySelector(
                        "link[rel~='icon']"
                    );


                if (!link) {

                    link =
                        document.createElement(
                            "link"
                        );

                    link.rel = "icon";

                    document.head.appendChild(
                        link
                    );

                }


                link.href =
                    savedFavicon;


                const faviconInput =
                    document.getElementById(
                        "faviconInput"
                    );


                if (faviconInput) {

                    faviconInput.value =
                        savedFavicon;

                }

            }

        }
    );

</script>



<!-- =========================
     SETTINGS MODAL CONTROLS
========================== -->

<script>

    document.addEventListener(
        "DOMContentLoaded",
        () => {


            const settingsModal =
                document.getElementById(
                    "wisp-settings-modal"
                );


            const closeSettings =
                document.getElementById(
                    "close-wisp-modal"
                );


            /*
             * Close Button
             */

            if (
                settingsModal &&
                closeSettings
            ) {

                closeSettings.addEventListener(
                    "click",
                    () => {

                        settingsModal.classList.add(
                            "hidden"
                        );

                    }
                );

            }


            /*
             * Close when clicking outside
             * the settings card.
             */

            if (settingsModal) {

                settingsModal.addEventListener(
                    "click",
                    (event) => {

                        if (
                            event.target ===
                            settingsModal
                        ) {

                            settingsModal.classList.add(
                                "hidden"
                            );

                        }

                    }
                );

            }


            /*
             * Close with Escape.
             */

            document.addEventListener(
                "keydown",
                (event) => {

                    if (
                        event.key === "Escape" &&
                        settingsModal &&
                        !settingsModal.classList.contains(
                            "hidden"
                        )
                    ) {

                        settingsModal.classList.add(
                            "hidden"
                        );

                    }

                }
            );


        }
    );

</script>



<!-- =========================
     VERCEL ANALYTICS
========================== -->

<script>

    window.va =
        window.va ||
        function () {

            (
                window.vaq =
                window.vaq ||
                []
            ).push(arguments);

        };


    window.addEventListener(
        "load",
        () => {

            const wispServer =
                localStorage.getItem(
                    "wispServer"
                );


            if (wispServer) {

                va(
                    "event",
                    "wisp_server_used",
                    {
                        server: wispServer
                    }
                );

            } else {

                va(
                    "event",
                    "wisp_server_used",
                    {
                        server: "unknown"
                    }
                );

            }

        }
    );


    /*
     * Function used when
     * changing Wisp servers.
     */

    window.trackWispServer =
        function (server) {

            localStorage.setItem(
                "wispServer",
                server
            );


            va(
                "event",
                "wisp_server_changed",
                {
                    server: server
                }
            );

        };

</script>



<!-- =========================
     DIRECT VISIT FLAG
========================== -->

<script>

    const direct =
        document.referrer === "";


    window.vercelFlags = {

        direct_visit:
            direct

    };


    document.documentElement.setAttribute(

        "data-flag-direct_visit",

        direct
            ? "true"
            : "false"

    );

</script>
